services:
  escaperoom_backend:
    image: escaperoomf5.azurecr.io/escaperoom-backend:latest
    container_name: escaperoom_backend
    ports:
      - "8000:8000"
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - ELEVENLABS_BASE_URL=${ELEVENLABS_BASE_URL}
      - WS_PING_INTERVAL_SECONDS=${WS_PING_INTERVAL_SECONDS:-30}

  escaperoom_frontend:
    image: escaperoomf5.azurecr.io/escaperoom-frontend:latest
    container_name: escaperoom_frontend
    ports:
      - "3003:80"
    depends_on:
      - escaperoom_backend
    restart: always