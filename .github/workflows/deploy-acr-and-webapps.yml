name: Build, push to ACR and deploy to Azure Web Apps

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  BACKEND_WEBAPP_NAME: ${{ secrets.BACKEND_WEBAPP_NAME }}
  FRONTEND_WEBAPP_NAME: ${{ secrets.FRONTEND_WEBAPP_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name $ACR_NAME

      - name: Validate required secrets
        run: |
          set -euo pipefail
          required=(
            ACR_NAME
            ACR_LOGIN_SERVER
            ACR_USERNAME
            ACR_PASSWORD
            AZURE_RESOURCE_GROUP
            BACKEND_WEBAPP_NAME
            FRONTEND_WEBAPP_NAME
          )
          for var in "${required[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required secret/env: $var"
              exit 1
            fi
          done

      - name: Build and push backend image
        run: |
          docker build -t escaperoom-backend:latest ./backend
          docker tag escaperoom-backend:latest $ACR_LOGIN_SERVER/escaperoom-backend:latest
          docker push $ACR_LOGIN_SERVER/escaperoom-backend:latest

      - name: Configure backend Web App to use new image
        run: |
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$BACKEND_WEBAPP_NAME" \
            --settings \
              WEBSITES_PORT=8000 \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false \
              ENVIRONMENT=production \
              WS_PING_INTERVAL_SECONDS=30
          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$BACKEND_WEBAPP_NAME" \
            --container-image-name "$ACR_LOGIN_SERVER/escaperoom-backend:latest" \
            --container-registry-url "https://$ACR_LOGIN_SERVER" \
            --container-registry-user "$ACR_USERNAME" \
            --container-registry-password "$ACR_PASSWORD"
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$BACKEND_WEBAPP_NAME"

      - name: Resolve backend host
        run: |
          BACKEND_HOST=$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$BACKEND_WEBAPP_NAME" \
            --query defaultHostName -o tsv)
          echo "BACKEND_HOST=$BACKEND_HOST" >> "$GITHUB_ENV"
          echo "Resolved backend host: $BACKEND_HOST"

      - name: Wait for backend to become available
        run: |
          BACKEND_URL="https://${BACKEND_HOST}"
          echo "Backend URL: $BACKEND_URL"
          # wait for HTTP 200 up to 2 minutes
          for i in {1..24}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL" || true)
            if [ "$status" = "200" ] || [ "$status" = "401" ] || [ "$status" = "404" ]; then
              echo "Backend reachable (HTTP $status)"; exit 0
            fi
            sleep 5
          done
          echo "Backend did not become reachable in time"; exit 1

      - name: Collect backend diagnostics on failure
        if: ${{ failure() }}
        run: |
          set +e
          BACKEND_HOST=$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$BACKEND_WEBAPP_NAME" \
            --query defaultHostName -o tsv)
          echo "Backend host: $BACKEND_HOST"
          curl -I --max-time 15 "https://${BACKEND_HOST}" || true

          az webapp log config \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$BACKEND_WEBAPP_NAME" \
            --web-server-logging filesystem \
            --docker-container-logging filesystem \
            --detailed-error-messages true \
            --failed-request-tracing true || true

          az webapp log download \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$BACKEND_WEBAPP_NAME" \
            --log-file backend-logs.zip || true

          if [ -f backend-logs.zip ]; then
            unzip -o backend-logs.zip -d backend-logs || true
            echo "Downloaded backend logs."
            find backend-logs -type f | head -n 30 || true
            for f in $(find backend-logs -type f | head -n 8); do
              echo "===== $f ====="
              tail -n 120 "$f" || true
            done
          else
            echo "No backend-logs.zip was generated."
          fi

      - name: Upload backend diagnostics artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend-logs.zip
            backend-logs/
          if-no-files-found: warn

      - name: Build and push frontend image (inject backend URL)
        run: |
          BACKEND_URL="https://${BACKEND_HOST}"
          docker build \
            --build-arg VITE_API_URL="$BACKEND_URL" \
            --build-arg VITE_API_URL_WS="wss://${BACKEND_HOST}/ws/sala" \
            -t escaperoom-frontend:latest ./frontend
          docker tag escaperoom-frontend:latest $ACR_LOGIN_SERVER/escaperoom-frontend:latest
          docker push $ACR_LOGIN_SERVER/escaperoom-frontend:latest

      - name: Configure frontend Web App to use new image
        run: |
          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FRONTEND_WEBAPP_NAME" \
            --container-image-name "$ACR_LOGIN_SERVER/escaperoom-frontend:latest" \
            --container-registry-url "https://$ACR_LOGIN_SERVER" \
            --container-registry-user "$ACR_USERNAME" \
            --container-registry-password "$ACR_PASSWORD"
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$FRONTEND_WEBAPP_NAME"
