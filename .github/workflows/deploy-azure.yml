name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
      
      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-backend:latest ./backend
          docker login -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }} ${{ secrets.ACR_LOGIN_SERVER }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-backend:latest
      
      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-frontend:latest \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_API_URL_WS=${{ secrets.VITE_API_URL_WS }} \
            ./frontend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-frontend:latest
      
      - name: Register Azure Container Instance provider
        run: |
          az provider register --namespace Microsoft.ContainerInstance
      
      - name: Deploy to Azure Container Instances
        run: |
          az container create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name escaperoom \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-backend:latest \
            --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --ports 8000 3003 \
            --cpu 2 \
            --memory 2 \
            --os-type Linux \
            --ip-address public \
            --environment-variables \
              DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              ENVIRONMENT="${{ secrets.ENVIRONMENT }}" \
              ELEVENLABS_API_KEY="${{ secrets.ELEVENLABS_API_KEY }}" \
              ELEVENLABS_VOICE_ID="${{ secrets.ELEVENLABS_VOICE_ID }}" \
              ELEVENLABS_BASE_URL="${{ secrets.ELEVENLABS_BASE_URL }}" \
              VITE_API_URL="${{ secrets.VITE_API_URL }}" \
              VITE_API_URL_WS="${{ secrets.VITE_API_URL_WS }}" \
              WS_PING_INTERVAL_SECONDS="${{ secrets.WS_PING_INTERVAL_SECONDS }}"
