name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Log in to Azure Container Registry
        run: |
          docker login -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }} ${{ secrets.ACR_LOGIN_SERVER }}
      
      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-backend:latest ./backend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-backend:latest
      
      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-frontend:latest \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_API_URL_WS=${{ secrets.VITE_API_URL_WS }} \
            ./frontend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-frontend:latest
      
      - name: Enable sidecar support on Web App
        run: |
          az webapp config set \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --linux-fx-version "SITECONTAINERS|escape-room"

      - name: Deploy sitecontainers
        run: |
          SPEC=$(jq -n \
            --arg fe_image "${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-frontend:latest" \
            --arg be_image "${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-backend:latest" \
            --arg acr_user "${{ secrets.ACR_USERNAME }}" \
            --arg acr_pass "${{ secrets.ACR_PASSWORD }}" \
            --arg db_url "${{ secrets.DATABASE_URL }}" \
            --arg env "${{ secrets.ENVIRONMENT }}" \
            --arg el_key "${{ secrets.ELEVENLABS_API_KEY }}" \
            --arg el_voice "${{ secrets.ELEVENLABS_VOICE_ID }}" \
            --arg el_url "${{ secrets.ELEVENLABS_BASE_URL }}" \
            --arg ws_ping "${{ secrets.WS_PING_INTERVAL_SECONDS }}" \
            '[
              {
                "name": "frontend",
                "properties": {
                  "image": $fe_image,
                  "targetPort": "80",
                  "isMain": true,
                  "authType": "UserCredentials",
                  "userName": $acr_user,
                  "passwordSecret": $acr_pass
                }
              },
              {
                "name": "backend",
                "properties": {
                  "image": $be_image,
                  "targetPort": "8000",
                  "isMain": false,
                  "authType": "UserCredentials",
                  "userName": $acr_user,
                  "passwordSecret": $acr_pass,
                  "environmentVariables": [
                    {"name": "DATABASE_URL", "value": $db_url},
                    {"name": "ENVIRONMENT", "value": $env},
                    {"name": "ELEVENLABS_API_KEY", "value": $el_key},
                    {"name": "ELEVENLABS_VOICE_ID", "value": $el_voice},
                    {"name": "ELEVENLABS_BASE_URL", "value": $el_url},
                    {"name": "WS_PING_INTERVAL_SECONDS", "value": $ws_ping}
                  ]
                }
              }
            ]')
          
          echo "$SPEC" > sitecontainers-spec.json
          
          az webapp sitecontainers create \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --sitecontainers-spec-file ./sitecontainers-spec.json
      
      - name: Restart Web App
        run: |
          az webapp restart \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}
