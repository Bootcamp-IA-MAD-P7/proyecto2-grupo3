name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
      
      - name: Build and push backend image
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image escaperoom-backend:latest \
            --file backend/Dockerfile ./backend
      
      - name: Build and push frontend image
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image escaperoom-frontend:latest \
            --file frontend/Dockerfile \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_API_URL_WS=${{ secrets.VITE_API_URL_WS }} \
            ./frontend
      
      - name: Deploy with docker-compose to Azure Container Apps
        run: |
          az containerapp up \
            --name escaperoom \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --compose-file-path docker-compose.prod.yml \
            --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --environment-variables \
              DATABASE_URL=${{ secrets.DATABASE_URL }} \
              ENVIRONMENT=${{ secrets.ENVIRONMENT }} \
              ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }} \
              ELEVENLABS_VOICE_ID=${{ secrets.ELEVENLABS_VOICE_ID }} \
              ELEVENLABS_BASE_URL=${{ secrets.ELEVENLABS_BASE_URL }} \
              VITE_API_URL=${{ secrets.VITE_API_URL }} \
              VITE_API_URL_WS=${{ secrets.VITE_API_URL_WS }} \
              WS_PING_INTERVAL_SECONDS=${{ secrets.WS_PING_INTERVAL_SECONDS }}
