name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Log in to Azure Container Registry
        run: |
          docker login -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }} ${{ secrets.ACR_LOGIN_SERVER }}
      
      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-backend:latest ./backend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-backend:latest
      
      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-frontend:latest \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_API_URL_WS=${{ secrets.VITE_API_URL_WS }} \
            ./frontend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-frontend:latest

      - name: Set backend environment variables as App Settings
        run: |
          az webapp config appsettings set \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --settings \
              DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              ENVIRONMENT="${{ secrets.ENVIRONMENT }}" \
              ELEVENLABS_API_KEY="${{ secrets.ELEVENLABS_API_KEY }}" \
              ELEVENLABS_VOICE_ID="${{ secrets.ELEVENLABS_VOICE_ID }}" \
              ELEVENLABS_BASE_URL="${{ secrets.ELEVENLABS_BASE_URL }}" \
              WS_PING_INTERVAL_SECONDS="${{ secrets.WS_PING_INTERVAL_SECONDS }}" \
              JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
              JWT_ALGORITHM="${{ secrets.JWT_ALGORITHM }}" \
              JWT_ACCESS_TOKEN_EXPIRE_MINUTES="${{ secrets.JWT_ACCESS_TOKEN_EXPIRE_MINUTES }}" \
              JWT_REFRESH_TOKEN_EXPIRE_DAYS="${{ secrets.JWT_REFRESH_TOKEN_EXPIRE_DAYS }}"

      - name: Deploy frontend sitecontainer (main)
        run: |
          az webapp sitecontainers create \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --container-name frontend \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-frontend:latest \
            --target-port 80 \
            --is-main true \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password "${{ secrets.ACR_PASSWORD }}"

      - name: Deploy backend sitecontainer (sidecar)
        run: |
          az webapp sitecontainers create \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --container-name backend \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/escaperoom-backend:latest \
            --target-port 8000 \
            --is-main false \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password "${{ secrets.ACR_PASSWORD }}"

      - name: Restart Web App
        run: |
          az webapp restart \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}
